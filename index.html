/* -------------------------------- HELPERS -------------------------------- */

function StatCard({ label, value, icon, color }) {
  return (
    <div style={{ flex: "1 1 160px", background: "#FFFFFF", border: "1px solid #ECE9E2", boxShadow: "0 1px 3px rgba(36,31,23,0.05)", borderRadius: 14, padding: 16 }}>
      <Icon name={icon} size={18} color={color} />
      <div style={{ fontSize: 24, fontWeight: 700, margin: "8px 0 2px" }}>{value}</div>
      <div style={{ fontSize: 12, color: "#8A8270" }}>{label}</div>
    </div>
  );
}

function SkillBar({ name, value, color }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "#4A4438", marginBottom: 5 }}>
        <span>{name}</span>
        <span style={{ fontWeight: 700, color }}>{value}%</span>
      </div>
      <div style={{ height: 8, borderRadius: 6, background: "#EEEAE0", overflow: "hidden" }}>
        <div style={{ width: `${value}%`, height: "100%", background: color, borderRadius: 6, transition: "width .5s ease" }} />
      </div>
    </div>
  );
}

function SectionCard({ title, icon, color, children, right }) {
  return (
    <div style={{ background: "#FFFFFF", border: "1px solid #ECE9E2", boxShadow: "0 1px 3px rgba(36,31,23,0.05)", borderRadius: 16, padding: 22 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <Icon name={icon} size={18} color={color} />
          <span style={{ fontWeight: 700, fontSize: 15 }}>{title}</span>
        </div>
        {right}
      </div>
      {children}
    </div>
  );
}

function Pill({ children, color }) {
  return (
    <span style={{ fontSize: 11.5, fontWeight: 600, color, background: `${color}14`, padding: "5px 10px", borderRadius: 999 }}>
      {children}
    </span>
  );
}

function PrimaryButton({ children, icon, onClick, disabled, tone }) {
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      style={{
        display: "flex", alignItems: "center", gap: 6, border: "none",
        background: disabled ? "#E4F5EE" : (tone || "#241F17"),
        color: disabled ? "#1B9E77" : "#FFF", fontSize: 12.5, fontWeight: 600, padding: "9px 14px", borderRadius: 999,
        cursor: disabled ? "default" : "pointer",
      }}
    >
      {children} {icon && <Icon name={icon} size={14} color={disabled ? "#1B9E77" : "#FFF"} />}
    </button>
  );
}

function OpportunityRow({ o, color, onView }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", border: "1px solid #ECE9E2", borderRadius: 14, padding: "14px 16px", flexWrap: "wrap", gap: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
        <div style={{ width: 40, height: 40, borderRadius: 10, background: `${color}1A`, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name="fact_check" size={18} color={color} />
        </div>
        <div>
          <div style={{ fontWeight: 700, fontSize: 14 }}>{o.title}</div>
          <div style={{ fontSize: 12.5, color: "#8A8270", display: "flex", alignItems: "center", gap: 6 }}>
            {o.org} · <Icon name="location_on" size={13} /> {o.loc}
          </div>
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
        <Pill color={color}>{o.type}</Pill>
        <div style={{ display: "flex", alignItems: "center", gap: 4, fontWeight: 700, fontSize: 13 }}>
          <Icon name="star" size={14} color="#F4C95D" filled /> {o.match}%
        </div>
        <PrimaryButton icon="chevron_right" onClick={() => onView(o)}>View</PrimaryButton>
      </div>
    </div>
  );
}

function FormField({ label, placeholder, textarea, value, onChange }) {
  const Tag = textarea ? "textarea" : "input";
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 12.5, fontWeight: 600, color: "#4A4438", marginBottom: 5 }}>{label}</div>
      <Tag
        placeholder={placeholder}
        rows={textarea ? 3 : undefined}
        value={value}
        onChange={onChange}
        style={{
          width: "100%", border: "1px solid #E7E2D8", borderRadius: 10, padding: "9px 12px",
          fontSize: 13, fontFamily: "'Space Grotesk', sans-serif", boxSizing: "border-box", resize: "none", color: "#241F17",
        }}
      />
    </div>
  );
}

          {data.rows.map((r) => (
            <div key={r.label} style={{ marginBottom: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 5 }}>
                <span>{r.label}</span>
                <span style={{ fontWeight: 700, color }}>{r.value}</span>
              </div>
              <div style={{ height: 8, borderRadius: 6, background: "#EEEAE0" }}>
                <div style={{ width: `${(r.value / max) * 100}%`, height: "100%", background: color, borderRadius: 6 }} />
              </div>
            </div>
          ))}
          <div style={{ marginTop: 20 }}>
            <PrimaryButton icon="download" onClick={() => showToast(`"${data.title}" downloaded successfully`)}>Download report</PrimaryButton>
          </div>
        </div>
      </PageShell>
    );
  }

  return null;
}

/* -------------------------------- TOAST -------------------------------- */

function Toast({ message }) {
  if (!message) return null;
  return (
    <div style={{
      position: "fixed", top: 20, right: 20, background: "#1B9E77", color: "#FFF",
      padding: "13px 20px", borderRadius: 10, fontSize: 13.5, fontWeight: 600,
      display: "flex", alignItems: "center", gap: 9, zIndex: 60,
      boxShadow: "0 8px 24px rgba(27,158,119,0.35)", maxWidth: 340,
    }}>
      <Icon name="check_circle" size={18} color="#FFFFFF" /> {message}
    </div>
  );
}

/* -------------------------------- APP SHELL -------------------------------- */

function SkillBridgePortal() {
  const [role, setRole] = useState(null);
  const [page, setPage] = useState("overview");
  const [special, setSpecial] = useState(null);
  const [detail, setDetail] = useState(null);
  const [stack, setStack] = useState([]);
  const [toast, setToast] = useState("");
  const [profiles, setProfiles] = useState(DEFAULT_PROFILES);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 2800);
    return () => clearTimeout(t);
  }, [toast]);

  const showToast = (msg) => setToast(msg);
  const snapshot = () => ({ role, page, special, detail });
  const pushStack = () => setStack((s) => [...s, snapshot()]);

  const navigate = (newRole, newPage) => {
    pushStack();
    setSpecial(null);
    setDetail(null);
    setRole(newRole);
    setPage(newPage);
  };

  const openDetail = (kind, data) => {
    pushStack();
    setSpecial(null);
    setDetail({ kind, data });
    setPage("detail");
  };

  const openSpecial = (name) => {
    pushStack();
    setSpecial(name);
  };

  const goBack = () => {
    setStack((s) => {
      if (s.length === 0) return s;
      const prev = s[s.length - 1];
      setRole(prev.role);
      setPage(prev.page);
      setSpecial(prev.special);
      setDetail(prev.detail);
      return s.slice(0, -1);
    });
  };

  const activeRole = role ? ROLES[role] : null;
  const activeNav = role ? NAV[role] : null;
  const PageComp = role ? PAGE_RENDER[role] : null;
  const activePageLabel = activeNav ? activeNav.find((n) => n.id === page)?.label : null;
  const effectiveRoleKey = role || "student";
  const currentProfile = profiles[effectiveRoleKey];

  return (
    <div style={{ fontFamily: "'Space Grotesk', sans-serif", background: "#FFFFFF", minHeight: "100vh", color: "#241F17", position: "relative" }}>
      <div style={{ background: "#241F17", color: "#D8CFC0", fontSize: 11.5, padding: "5px 28px", display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 6 }}>
        <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
          <span>Government of India</span>
          <span style={{ display: "flex", alignItems: "center", gap: 4 }}><Icon name="accessibility_new" size={13} /> Accessibility</span>
        </div>
        <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
          <span style={{ display: "flex", alignItems: "center", gap: 4 }}><Icon name="public" size={13} /> English</span>
          <span style={{ display: "flex", alignItems: "center", gap: 4 }}><Icon name="call" size={13} /> Helpline: 1800-11-XXXX</span>
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 28px", borderBottom: "1px solid #ECE9E2", flexWrap: "wrap", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <button
            onClick={goBack}
            disabled={stack.length === 0}
            style={{
              display: "flex", alignItems: "center", gap: 4, border: "1px solid #E7E2D8", background: "#FFFFFF",
              borderRadius: 999, padding: "7px 12px", fontSize: 12.5, fontWeight: 600, cursor: stack.length ? "pointer" : "default",
              color: stack.length ? "#241F17" : "#C9C2B3",
            }}
          >
            <Icon name="chevron_left" size={16} /> Back
          </button>
          <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }} onClick={() => navigate(null, "overview")}>
            <div style={{ width: 34, height: 34, borderRadius: 8, background: "#241F17", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name="auto_awesome" size={18} color="#F4C95D" />
            </div>
            <div>
              <div style={{ fontWeight: 700, fontSize: 16, letterSpacing: -0.3 }}>SkillBridge</div>
              <div style={{ fontSize: 10.5, color: "#8A8270" }}>Academia–Industry Collaboration Portal · Ministry of AYUSH</div>
            </div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 18, fontSize: 13, color: "#4A4438" }}>
          <span style={{ display: "flex", alignItems: "center", gap: 5, cursor: "pointer" }} onClick={() => navigate(null, "overview")}><Icon name="home" size={16} /> Home</span>
          <span style={{ display: "flex", alignItems: "center", gap: 5, cursor: "pointer", position: "relative" }} onClick={() => openSpecial("notifications")}>
            <Icon name="notifications" size={16} /> Notifications
            <span style={{ position: "absolute", top: -6, right: -10, background: "#E8622C", color: "#FFF", fontSize: 9.5, fontWeight: 700, borderRadius: 999, padding: "1px 5px" }}>3</span>
          </span>
          <span style={{ display: "flex", alignItems: "center", gap: 5, cursor: "pointer" }} onClick={() => openSpecial("profile")}>
            <Icon name="account_circle" size={17} /> {activeRole ? activeRole.label : "Guest"}
          </span>
        </div>
      </div>

      {special === "notifications" && <NotificationsPage />}

      {special === "profile" && (
        <ProfilePage
          profile={currentProfile}
          setProfile={(p) => setProfiles({ ...profiles, [effectiveRoleKey]: p })}
          roleLabel={activeRole ? activeRole.label : "Guest"}
          color={activeRole ? activeRole.color : "#2F80ED"}
          bg={activeRole ? activeRole.bg : "#EAF2FE"}
        />
      )}

      {!special && !role && <Landing goTo={(k) => navigate(k, "overview")} />}

      {!special && role && (
        <div style={{ display: "flex", alignItems: "flex-start" }}>
          <div style={{ width: 220, flexShrink: 0, borderRight: "1px solid #ECE9E2", padding: "20px 12px", minHeight: "70vh" }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5, color: "#8A8270", padding: "0 10px 10px" }}>
              {activeRole.label} portal
            </div>
            {activeNav.map((n) => {
              const isActive = page === n.id;
              return (
                <button key={n.id} onClick={() => navigate(role, n.id)}
                  style={{
                    width: "100%", display: "flex", alignItems: "center", gap: 9, textAlign: "left",
                    padding: "9px 10px", borderRadius: 10, border: "none", marginBottom: 3,
                    background: isActive ? activeRole.bg : "transparent",
                    color: isActive ? activeRole.color : "#4A4438",
                    fontWeight: isActive ? 700 : 500, fontSize: 13, cursor: "pointer",
                  }}>
                  <Icon name={n.icon} size={17} color={isActive ? activeRole.color : "#4A4438"} /> {n.label}
                </button>
              );
            })}
            <div style={{ marginTop: 16, padding: "0 10px" }}>
              {Object.entries(ROLES).filter(([k]) => k !== role).map(([k, r]) => (
                <div key={k} onClick={() => navigate(k, "overview")} style={{ fontSize: 11.5, color: "#8A8270", cursor: "pointer", padding: "4px 0" }}>
                  Switch to {r.label} →
                </div>
              ))}
            </div>
          </div>

          <div style={{ flex: 1, padding: "24px 28px", minWidth: 0 }}>
            <div style={{ fontSize: 12, color: "#8A8270", marginBottom: 16 }}>
              SkillBridge / {activeRole.label} / <span style={{ color: "#241F17", fontWeight: 600 }}>{page === "detail" ? detail?.data?.title : activePageLabel}</span>
            </div>
            {page === "detail" && detail ? (
              <DetailPage kind={detail.kind} data={detail.data} color={activeRole.color} showToast={showToast} />
            ) : (
              <React.Fragment>
                <div style={{ fontFamily: "'Newsreader', serif", fontStyle: "italic", fontSize: 22, marginBottom: 18 }}>
                  {activePageLabel}
                </div>
                <PageComp page={page} color={activeRole.color} bg={activeRole.bg} showToast={showToast} openDetail={openDetail} />
              </React.Fragment>
            )}
          </div>
        </div>
      )}

      <div style={{ borderTop: "1px solid #ECE9E2", padding: "18px 28px", fontSize: 11.5, color: "#8A8270", marginTop: 20 }}>
        © 2026 SkillBridge · An initiative under the Ministry of AYUSH, Government of India · Smart Automation Theme
      </div>

      <Toast message={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SkillBridgePortal />);
</script>
</body>
</html>
